name: Verified browser release
on:
  push:
    tags: ['showcase-*']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require verified main and a new immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^showcase-[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-[0-9]+)?$ ]]
          refs=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          source=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1;exit}')
          [[ -n "$source" ]] || source=$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')
          test "$source" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/user-edition.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" > "$RUNNER_TEMP/source-ci.json"
          node --input-type=module - "$RUNNER_TEMP/source-ci.json" <<'JS'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).workflow_runs;
          if(!rows.some(r=>r.head_sha===process.env.GITHUB_SHA&&r.head_branch==='main'&&r.conclusion==='success'))process.exit(1);
          JS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm run build:browser
      - name: Package only the runnable browser closure and licenses
        run: |
          set -euo pipefail
          mkdir release
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,zipfile
          expected={'index.html','editor.js','preset.js','android-waveform.js','style.css','haptic.svg'}
          root=Path('browser-dist');files=list(root.rglob('*'));assert len(files)<=32
          assert {p.name for p in files if p.is_file()}==expected
          assert all(p.is_file() and not p.is_symlink() and p.parent==root and p.stat().st_size<=8*1024**2 for p in files)
          assert sum(p.stat().st_size for p in files)<=32*1024**2
          payload={p.name:p.read_bytes() for p in files}
          for name in ['LICENSE','THIRD_PARTY_NOTICES.md']:
              p=Path(name);assert p.is_file() and not p.is_symlink() and p.stat().st_size<=1024**2
              payload[name]=p.read_bytes()
          archive=Path('release/haptic-browser.zip')
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED) as bundle:
              for name,data in sorted(payload.items()):
                  info=zipfile.ZipInfo('haptic-browser/'+name,(2020,1,1,0,0,0));info.external_attr=0o100644<<16;info.compress_type=zipfile.ZIP_DEFLATED;bundle.writestr(info,data)
          Path('release/source-manifest.json').write_text(json.dumps({'schema':'haptic.browser-release/v1','sourceCommit':os.environ['GITHUB_SHA'],'tag':os.environ['GITHUB_REF_NAME'],'artifact':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':{n:hashlib.sha256(v).hexdigest() for n,v in sorted(payload.items())},'mode':'fixed public examples; no device or model connection'},indent=2)+'\n')
          PY
          (cd release && sha256sum *.zip *.json > checksums.txt)
      - name: Attest browser distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.zip
      - name: Publish while preserving desktop Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Haptic Bridge · 浏览器参数样例 $GITHUB_REF_NAME" --notes '固定节奏样例→四段编辑→预览→Android参数或Studio模式库。解压后用静态服务器打开index.html，例如python3 -m http.server。包内无设备连接、模型请求或私有候选后端；保留原桌面Latest与下载地址。附源码身份、校验和与构建来源证明。' release/*
