<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="编辑一段触觉模式的强度和时长，在浏览器中预览波形。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><link rel="stylesheet" href="./style.css"><link rel="icon" href="./haptic.svg"><title>波形编辑器 · Haptic Bridge</title></head>
<body><header><img src="./haptic.svg" width="34" height="34" alt=""><strong>Haptic Bridge</strong><a href="https://github.com/Chumaniac/haptic-bridge-app">本机安装 ↗</a></header>
<a class="skip" href="#main">跳到波形编辑</a><main id="main"><div class="page-heading"><div><p class="eyebrow">PATTERN LAB</p><h1>波形编辑器</h1><p>设置四个阶段的强度与持续时间，查看一个周期的波形。预览只绘图，不驱动设备。</p></div><span class="mode-label">仅模拟</span></div><div class="editor-workspace">
<section class="scope-panel"><div class="scope-heading"><h2>信号预览</h2><span>0—100% · 单周期</span></div><svg id="scope" viewBox="0 0 600 140" role="img" aria-label="单周期强度波形"><path class="grid" d="M0 20H600 M0 70H600 M0 120H600"/><path id="trace" fill="none"/></svg><output aria-live="polite">等待预览</output><p class="scope-caption">横轴为持续时间，纵轴为强度。导出保留全部周期。</p></section>
<form><div class="heading"><h2>模式参数</h2><label>周期数 <input id="cycles" type="number" min="1" max="10" step="1" value="1" required></label></div><label class="pattern-label">模式名称<input id="pattern-name" maxlength="48" value="浏览器草稿" autocomplete="off" required></label><div id="steps"></div><div class="wave-actions"><button>预览波形</button><button id="export-android" type="button">导出 Android 波形参数</button><button id="export-library" type="button">在本机 Studio 继续</button></div><p class="handoff-note">下载模式库文件，在 Studio 选择“选择文件导入”。导入前可先备份，确认后会替换本机模式库与偏好。</p></form>
</div></main><script type="module" src="./editor.js"></script></body></html>
